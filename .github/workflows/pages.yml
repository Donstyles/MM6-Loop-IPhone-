name: Deploy game to GitHub Pages

# Publishes play/ (the one-file build) to GitHub Pages on every push.
#
# Pages must be switched on once by the repo owner: Settings -> Pages ->
# Build and deployment -> Source: "GitHub Actions". Until then the check
# step below sees the Pages API answer 404 and the run skips quietly
# instead of failing.

on:
  push:
    branches: [claude/mm6-iphone-game-ifzbqj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages API answered $code"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for this repository yet. Enable it under Settings -> Pages -> Source: GitHub Actions, and the next push will deploy the game."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: play
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
