<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-title" content="Might &amp; Magic VI" />
<link rel="icon" type="image/png" href="./icon.png" />
<link rel="apple-touch-icon" href="./icon.png" />
<title>Might and Magic VI &mdash; The Mandate of Heaven</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage {
    position: absolute; inset: 0;
    display: block;
    background: #000;
  }
  canvas { display: block; position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
  #gl { z-index: 1; }
  #ui { z-index: 2; }
  #boot {
    position: absolute; inset: 0; z-index: 10; background: #000;
    color: #d8c47a; font: 14px/1.5 monospace; display: flex;
    align-items: center; justify-content: center; text-align: center;
  }
</style>
  <script type="module" crossorigin src="./game.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
  <div id="boot">Loading&hellip;</div>
</div>
</body>
</html>
