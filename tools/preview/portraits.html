<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MM6 portraits preview</title>
<style>
  body { margin: 0; background: #0b0b0d; color: #c8b98a; font: 11px/1.35 monospace; padding: 10px; }
  h2 { color: #e0c878; font-size: 13px; margin: 14px 0 6px; border-bottom: 1px solid #3a3324; padding-bottom: 3px; }
  canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<h2>P. party rows of four &mdash; the test that matters. 1:1 (left) and 3&times;</h2><div id="p"></div>
<h2>A. 24 faces &mdash; 1:1 and 4&times;</h2><div id="a"></div>
<h2>B. every expression, 3&times; (knight m) </h2><div id="b"></div>
<h2>B2. every expression, 3&times; (sorcerer f)</h2><div id="c"></div>
<h2>C. mock party bar, 1:1</h2><div id="d"></div>
<h2>D. close-ups, 6&times; &mdash; look for brow ridge, nose shadow on the cheek, dark neck</h2><div id="e"></div>
<script type="module">
import { makeFace, renderPortrait, PORTRAIT_W as PW, PORTRAIT_H as PH, EXPRESSIONS, portraitSheet }
  from '/src/art/portraits.js';

// ?sec=a|b|c|d renders one section only, so each can be screenshotted at a
// size the headless compositor is happy with.
const SEC = new URLSearchParams(location.search).get('sec') || 'all';
const want = (k) => SEC === 'all' || SEC === k;
for (const k of ['p', 'a', 'b', 'c', 'd', 'e']) {
  if (!want(k)) { const e = document.getElementById(k); e.previousElementSibling.remove(); e.remove(); }
}

const FONT = '9px monospace';
function sheetOf(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#141210'; g.fillRect(0, 0, w, h);
  g.font = FONT; g.textBaseline = 'top';
  return { c, g };
}
function label(g, x, y, lines, col = '#8d8266') {
  g.fillStyle = col;
  lines.forEach((t, i) => g.fillText(t, x, y + i * 10));
}

// --- P: rows of four, exactly as the party bar shows them -------------------
// This is the section that decides whether the variety is good enough: if any
// two faces in a row could be mistaken for each other at a glance, it is not.
// Seeds are drawn the way party.js draws them - a full-range random int per
// character - so these are the faces a real party actually gets.
const KL = ['knight', 'paladin', 'archer', 'cleric', 'sorcerer', 'druid'];
if (want('p')) {
  const ROWS = 10;
  // Deterministic 32-bit LCG standing in for the party generator's rand.int.
  let s = 0x13579bdf;
  const rnd = () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
  const rint = (n) => Math.floor(rnd() * n);

  const party = [];
  const t0 = performance.now();
  for (let ri = 0; ri < ROWS; ri++) {
    const row = [];
    for (let i = 0; i < 4; i++) {
      const klass = KL[rint(6)];
      const sex = rnd() < 0.5 ? 'm' : 'f';
      const f = makeFace(rint(0x7fffffff), { klass, sex });
      row.push({ f, klass, sex, img: renderPortrait(f, 'normal') });
    }
    party.push(row);
  }
  console.log('P ms', (performance.now() - t0).toFixed(0));

  // P1: every row at 1:1 and at 2x, stacked tight. This is the view that
  // decides the question - two faces in a row must never swap.
  const GAP = 5, PAD = 8;
  const barW = 4 * (PW + GAP) + PAD, barH = PH + PAD;
  const bar2W = 4 * (PW * 2 + GAP) + PAD, bar2H = PH * 2 + PAD;
  {
    const { c, g } = sheetOf(barW + bar2W + 24, ROWS * (bar2H + 6) + 8);
    party.forEach((row, ri) => {
      const y = 4 + ri * (bar2H + 6);
      g.fillStyle = '#241d14'; g.fillRect(4, y, barW, barH);
      g.fillStyle = '#241d14'; g.fillRect(4 + barW + 12, y, bar2W, bar2H);
      row.forEach((e, i) => {
        g.drawImage(e.img, 4 + PAD / 2 + i * (PW + GAP), y + PAD / 2);
        g.drawImage(e.img, 4 + barW + 12 + PAD / 2 + i * (PW * 2 + GAP), y + PAD / 2, PW * 2, PH * 2);
      });
      label(g, 6, y + barH + 4, [`row ${ri}`], '#6d6350');
    });
    document.getElementById('p').appendChild(c);
  }

  // P2: the same rows at 3x with the descriptor of each face.
  {
    const Z = 3, bigW = 4 * (PW * Z + GAP) + PAD, bigH = PH * Z + PAD;
    const { c, g } = sheetOf(bigW + 8, ROWS * (bigH + 26) + 8);
    party.forEach((row, ri) => {
      const y = 4 + ri * (bigH + 26);
      g.fillStyle = '#1a1610'; g.fillRect(4, y, bigW, bigH);
      row.forEach((e, i) => {
        const { f } = e;
        g.drawImage(e.img, 4 + PAD / 2 + i * (PW * Z + GAP), y + PAD / 2, PW * Z, PH * Z);
        const t = `${e.klass[0].toUpperCase()}${e.sex} ${f.age.slice(0, 3)} ${f.toneName.slice(0, 5)} `
          + `${f.hairStyle}/${f.hairName.slice(0, 5)} ${f.cut.hairline.slice(0, 4)}`
          + `${f.cut.front ? '+fr' : ''} ${f.shape.slice(0, 4)} ${f.beard.slice(0, 5)}`
          + `${f.gear.hood ? ' HOOD' : ''}${f.gear.coif ? ' COIF' : ''}`
          + `${f.gear.helm ? ' HELM' : ''}${f.gear.hat ? ' HAT' : ''}`;
        label(g, 4 + PAD / 2 + i * (PW * Z + GAP), y + bigH + 2,
          [`${ri}.${i} ` + t.slice(0, 30), t.slice(30)], '#9a8d6c');
      });
    });
    document.getElementById('p').appendChild(c);
  }
}

// --- A: 24 faces, 1:1 next to 4x ------------------------------------------
const roster = [];
if (true) {
  const COLS = 4, CW = PW + 6 + PW * 4 + 14, CH = PH * 4 + 44;
  const { c, g } = sheetOf(COLS * CW + 8, Math.ceil(24 / COLS) * CH + 8);
  const t0 = performance.now();
  for (let i = 0; i < 24; i++) {
    const klass = KL[i % 6];
    const sex = i % 12 < 6 ? 'm' : 'f';
    const age = ['young', 'middle', 'old'][(i * 5) % 3];
    const f = makeFace(1000 + i * 37, { klass, sex, age });
    roster.push(f);
    const p = renderPortrait(f, 'normal');
    const x = 4 + (i % COLS) * CW, y = 4 + Math.floor(i / COLS) * CH;
    g.drawImage(p, x, y);
    g.drawImage(p, x + PW + 6, y, PW * 4, PH * 4);
    label(g, x, y + PH * 4 + 4, [
      `${klass} ${sex}/${age}`,
      `${f.hairStyle}/${f.hairName} ${f.shape}`,
      `${f.beard} skin:${f.toneName} eye:${f.eyeName}`,
    ]);
  }
  console.log('A ms', (performance.now() - t0).toFixed(0));
  if (want('a')) document.getElementById('a').appendChild(c);
}

// --- B: all expressions ----------------------------------------------------
function exprSheet(face, host) {
  const Z = 3, COLS = 7, CW = PW * Z + 8, CH = PH * Z + 16;
  const { c, g } = sheetOf(COLS * CW + 8, Math.ceil(EXPRESSIONS.length / COLS) * CH + 8);
  EXPRESSIONS.forEach((e, i) => {
    const p = renderPortrait(face, e);
    const x = 4 + (i % COLS) * CW, y = 4 + Math.floor(i / COLS) * CH;
    g.drawImage(p, x, y, PW * Z, PH * Z);
    label(g, x, y + PH * Z + 3, [e], '#d0bd84');
  });
  if (want(host)) document.getElementById(host).appendChild(c);
}
const t1 = performance.now();
if (want('b')) exprSheet(roster[0], 'b');
if (want('c')) exprSheet(roster[16], 'c');
console.log('B ms', (performance.now() - t1).toFixed(0));

// --- C: mock party bar -----------------------------------------------------
if (want('d')) {
  const groups = [
    [['knight', 'm', 'normal'], ['cleric', 'f', 'normal'], ['sorcerer', 'm', 'normal'], ['archer', 'f', 'normal']],
    [['paladin', 'f', 'normal'], ['druid', 'm', 'normal'], ['knight', 'f', 'normal'], ['sorcerer', 'f', 'normal']],
    [['knight', 'm', 'hurt'], ['cleric', 'f', 'poisoned'], ['sorcerer', 'm', 'dead'], ['archer', 'f', 'asleep']],
  ];
  const BW2 = 4 * (PW + 6) + 18, BH2 = PH + 18;
  const { c, g } = sheetOf(groups.length * (BW2 + 10) + 8, BH2 + 8);
  groups.forEach((grp, gi) => {
    const ox = 4 + gi * (BW2 + 10);
    g.fillStyle = '#241d14'; g.fillRect(ox, 4, BW2, BH2);
    g.strokeStyle = '#6b5a3a'; g.lineWidth = 2; g.strokeRect(ox + 1, 5, BW2 - 2, BH2 - 2);
    grp.forEach(([k, s, e], i) => {
      const f = makeFace(4000 + gi * 311 + i * 91, { klass: k, sex: s });
      g.drawImage(renderPortrait(f, e), ox + 9 + i * (PW + 6), 13);
    });
  });
  if (want('d')) document.getElementById('d').appendChild(c);
}

// --- D: big close-ups -------------------------------------------------------
if (want('e')) {
  const specs = [
    ['knight', 'm', 'middle', 6001], ['archer', 'f', 'young', 6102],
    ['sorcerer', 'm', 'old', 6203], ['cleric', 'f', 'middle', 6304],
    ['druid', 'm', 'old', 6405], ['paladin', 'f', 'young', 6506],
  ];
  const Z = 6, CW = PW * Z + 10, CH = PH * Z + 18;
  const { c, g } = sheetOf(specs.length / 2 * CW + 8, 2 * CH + 8);
  specs.forEach(([k, sx, age, seed], i) => {
    const f = makeFace(seed, { klass: k, sex: sx, age });
    const x = 4 + (i % 3) * CW, y = 4 + Math.floor(i / 3) * CH;
    g.drawImage(renderPortrait(f, i % 2 ? 'normal' : 'angry'), x, y, PW * Z, PH * Z);
    label(g, x, y + PH * Z + 3, [`${k} ${sx}/${age} ${f.hairStyle}/${f.beard}`], '#d0bd84');
  });
  document.getElementById('e').appendChild(c);
}

const t2 = performance.now();
const sh = SEC === 'all' ? portraitSheet(roster[3]) : { canvas: { width: 0, height: 0 }, index: () => 0, rect: () => ({}) };
console.log('sheet ms', (performance.now() - t2).toFixed(0),
  sh.canvas.width + 'x' + sh.canvas.height, 'idx(dead)=' + sh.index('dead'), JSON.stringify(sh.rect('cast')));

window.__ready = true;
</script>
</body>
</html>
