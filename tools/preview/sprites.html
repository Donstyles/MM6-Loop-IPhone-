<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MM6 sprite bake preview</title>
<style>
  body { margin: 0; background: #14151a; color: #d8c47a; font: 12px/1.4 monospace; }
  h2 { color: #f0e0a0; font-size: 14px; margin: 14px 0 6px 8px; }
  #info { padding: 8px; color: #9fd6a0; white-space: pre; }
  canvas.sheet { display: block; margin: 0 0 2px 0; image-rendering: pixelated; }
  #gl { display: none; }
</style>
</head>
<body>
<canvas id="gl" width="64" height="64"></canvas>
<div id="info">baking...</div>
<div id="out"></div>
<script type="module">
import * as THREE from 'three';
import { getSheet, bakeSheet, ANGLES, VIEWS } from '/src/art/spritebake.js';
import { CREATURE_DEFS, CREATURE_FAMILIES, CREATURE_TIERS, NPC_ARCHETYPES, ACTIONS } from '/src/art/models/creatures.js';
import { FLORA_KINDS } from '/src/art/models/flora.js';
import { PROP_KINDS } from '/src/art/models/props.js';

const qs = new URLSearchParams(location.search);
const page = qs.get('page') || 'angles';
const from = +(qs.get('from') || 0);
const count = +(qs.get('count') || 28);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), alpha: true, antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(64, 64, false);

const out = document.getElementById('out');
const info = document.getElementById('info');
const log = [];

function makeCv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h; c.className = 'sheet';
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return { c, g };
}

/** Checkerboard so a soft/grey halo around a sprite is impossible to miss. */
function checker(g, x, y, w, h, a = '#2a2c34', b = '#3a3d47') {
  for (let yy = 0; yy < h; yy += 8) {
    for (let xx = 0; xx < w; xx += 8) {
      g.fillStyle = (((xx / 8) + (yy / 8)) & 1) ? a : b;
      g.fillRect(x + xx, y + yy, 8, 8);
    }
  }
}

function label(g, text, x, y, col = '#f0e0a0') {
  g.font = '11px monospace';
  g.fillStyle = col;
  g.fillText(text, x, y);
}

/** Draw one strip of cells from a sheet, honouring the octant mirror flag. */
function strip(g, sheet, cells, x, y, zoom, bg) {
  const w = sheet.cellW * zoom, h = sheet.cellH * zoom;
  if (bg === 'checker') checker(g, x, y, w * cells.length, h);
  else { g.fillStyle = bg; g.fillRect(x, y, w * cells.length, h); }
  cells.forEach((c, i) => {
    const r = sheet.rect(c[0], c[1], c[2]);
    const dx = x + i * w;
    if (r.mirror) {
      g.save();
      g.translate(dx + w, y);
      g.scale(-1, 1);
      g.drawImage(sheet.canvas, r.x, r.y, r.w, r.h, 0, 0, w, h);
      g.restore();
    } else {
      g.drawImage(sheet.canvas, r.x, r.y, r.w, r.h, dx, y, w, h);
    }
  });
  return { w: w * cells.length, h };
}

function heading(text) {
  const h = document.createElement('h2');
  h.textContent = text;
  out.appendChild(h);
}

// ---------------------------------------------------------------------------

const t0 = performance.now();
let baked = 0;

function sheetOf(cat, kind, seed = 3) {
  const s = getSheet(renderer, cat, kind, seed);
  baked++;
  return s;
}

function pageAngles(kinds, cat) {
  heading(`${cat}: all 8 octants (stand frame 0) - octant 0 faces the camera, 4 is the back, 5-7 are mirrors of 3-1`);
  for (const kind of kinds) {
    const sh = sheetOf(cat, kind);
    const zoom = Math.max(1, Math.min(3, Math.floor(150 / sh.cellH) || 1));
    const cells = [];
    for (let a = 0; a < ANGLES; a++) cells.push(['stand', 0, a]);
    const { c, g } = makeCv(1390, sh.cellH * zoom + 16);
    g.fillStyle = '#14151a'; g.fillRect(0, 0, c.width, c.height);
    const nm = CREATURE_DEFS[kind] ? CREATURE_DEFS[kind].name : (CREATURE_FAMILIES[kind] ? CREATURE_FAMILIES[kind].tiers[0].name : kind);
    label(g, `${kind} (${nm})  atlas ${sh.atlasW}x${sh.atlasH}  cell ${sh.cellW}x${sh.cellH}  ${sh.frames}f x ${sh.views}v  world ${sh.worldH | 0}u`, 4, 11);
    strip(g, sh, cells, 4, 14, zoom, 'checker');
    // the same octants on magenta: any soft edge shows up instantly
    strip(g, sh, cells, 4 + sh.cellW * zoom * 8 + 12, 14, zoom, '#c0208c');
    out.appendChild(c);
  }
}

function pageAnim(kinds) {
  heading('animation groups at octant 2 (side) and octant 6 (mirrored side), 2x');
  for (const kind of kinds) {
    const sh = sheetOf('creature', kind);
    const zoom = 2;
    const n = (a) => sh.actions[a].frames;
    const rows = [
      ['walk o2', Array.from({ length: n('walk') }, (_, i) => ['walk', i, 2])],
      ['walk o6*', Array.from({ length: n('walk') }, (_, i) => ['walk', i, 6])],
      ['melee o2', Array.from({ length: n('attack_melee') }, (_, i) => ['attack_melee', i, 2])],
      ['ranged o2', Array.from({ length: n('attack_ranged') }, (_, i) => ['attack_ranged', i, 2])],
      ['bored o2', Array.from({ length: n('bored') }, (_, i) => ['bored', i, 2])],
      ['dying o2', Array.from({ length: n('dying') }, (_, i) => ['dying', i, 2])],
    ];
    const h = 16 + rows.length * (sh.cellH * zoom + 4);
    const { c, g } = makeCv(1390, h);
    g.fillStyle = '#14151a'; g.fillRect(0, 0, c.width, c.height);
    label(g, `${kind}`, 4, 11);
    rows.forEach((r, i) => {
      const y = 14 + i * (sh.cellH * zoom + 4);
      strip(g, sh, r[1], 90, y, zoom, 'checker');
      label(g, r[0], 4, y + 14, '#9fd6a0');
    });
    out.appendChild(c);
  }
}

function pageGame(kinds) {
  heading('in-game size: a 192-unit humanoid at 1000 units is ~65px tall on a 460x352 buffer (top row), and the same sprite at 3x (bottom)');
  const { c, g } = makeCv(1390, 620);
  g.fillStyle = '#5a6a4a'; g.fillRect(0, 0, c.width, 300);
  g.fillStyle = '#7c8fa8'; g.fillRect(0, 0, c.width, 120);
  g.fillStyle = '#3a4a30'; g.fillRect(0, 300, c.width, 320);
  let x = 8;
  for (const kind of kinds) {
    const sh = sheetOf('creature', kind);
    const px = Math.round(352 * sh.worldH / 1041);   // 55 deg vfov, 1000 units away
    const w = Math.round(px * sh.cellW / sh.cellH);
    g.drawImage(sh.canvas, sh.rect('stand', 0, 1).x, sh.rect('stand', 0, 1).y, sh.cellW, sh.cellH, x, 290 - px, w, px);
    // and again at 3x so the pixels are inspectable
    g.drawImage(sh.canvas, sh.rect('stand', 0, 1).x, sh.rect('stand', 0, 1).y, sh.cellW, sh.cellH, x, 320, w * 3, px * 3);
    label(g, kind.slice(0, 14), x, 300);
    x += Math.max(w * 3, 70) + 10;
    if (x > 1300) break;
  }
  out.appendChild(c);
}

function pageAtlas(kinds) {
  heading('full atlases at 1x (rows = frames, columns = 8 angles per block)');
  for (const kind of kinds) {
    const sh = sheetOf('creature', kind);
    const { c, g } = makeCv(Math.max(400, sh.atlasW + 8), sh.atlasH + 18);
    g.fillStyle = '#14151a'; g.fillRect(0, 0, c.width, c.height);
    label(g, `${kind}  ${sh.atlasW}x${sh.atlasH}  blocks/row ${sh.blocks}  rows ${sh.rows}`, 4, 11);
    checker(g, 4, 14, sh.atlasW, sh.atlasH);
    g.drawImage(sh.canvas, 4, 14);
    out.appendChild(c);
  }
}

const CREATURES = qs.get('tiers') ? Object.keys(CREATURE_TIERS) : Object.keys(CREATURE_FAMILIES);

try {
  if (page === 'angles') pageAngles(CREATURES.slice(from, from + count), 'creature');
  else if (page === 'anim') pageAnim(CREATURES.slice(from, from + count));
  else if (page === 'flora') pageAngles(FLORA_KINDS.slice(from, from + count), 'flora');
  else if (page === 'props') pageAngles(PROP_KINDS.slice(from, from + count), 'prop');
  else if (page === 'npc') pageAngles(NPC_ARCHETYPES.slice(from, from + count), 'npc');
  else if (page === 'game') pageGame(CREATURES.slice(from, from + count));
  else if (page === 'atlas') pageAtlas(CREATURES.slice(from, from + count));
  else if (page === 'bench') {
    // 40 creatures, cold cache, for the timing number in the report
    const list = CREATURES.slice(0, 40);
    const b0 = performance.now();
    let px = 0;
    for (const k of list) { const s = getSheet(renderer, 'creature', k, 99); px += s.atlasW * s.atlasH; baked++; }
    const b1 = performance.now();
    log.push(`bench: ${list.length} creature sheets in ${(b1 - b0).toFixed(0)} ms  (${((b1 - b0) / list.length).toFixed(1)} ms each), ${(px / 1e6).toFixed(2)} Mpx of atlas`);
    pageAngles(list.slice(0, 6), 'creature');
  }
} catch (e) {
  log.push('ERROR: ' + (e && e.stack || e));
  console.error(e);
}

const t1 = performance.now();
info.textContent = [`page=${page} from=${from} count=${count}`,
  `${baked} sheets baked in ${(t1 - t0).toFixed(0)} ms`, ...log].join('\n');
window.__ready = true;
</script>
</body>
</html>
